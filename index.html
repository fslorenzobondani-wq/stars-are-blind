<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STARS ARE BLIND — Paris Hilton Daily Quote</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- html2canvas per snapshot dell'immagine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --bg-color: #fdfbf7;
      --card-bg: #ffffff;
      --text-main: #111111;
      --text-muted: #8a8a8a;
      --accent-pink: #ff2a85;
      --border-color: #eae5dd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2.5rem 1rem;
      overflow-x: hidden;
    }

    /* Sfondo collage, fisso dietro tutta la pagina (opacità 15%) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("sfondo.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.15;
      z-index: -1;
      pointer-events: none;
    }

    .grain-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.035;
      z-index: 99;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    header { text-align: center; margin-bottom: 2rem; }

    .brand-title {
      font-family: 'Bodoni Moda', serif;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .card-container { width: 100%; max-width: 560px; margin: 0 auto; }

    /* Card stile Co-Star: la quote di oggi è l'unica protagonista */
    .quote-card {
      background: var(--card-bg);
      border: 1px solid var(--text-main);
      padding: 2rem 2rem 2.2rem;
      text-align: left;
      transition: opacity 0.3s ease, transform 0.3s ease;
      display: flex;
      flex-direction: column;
      min-height: 520px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--text-main);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .card-label { color: var(--accent-pink); }
    .card-date { color: var(--text-main); }

    .quote-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 2.5rem 0;
    }

    .quote-text {
      font-family: 'Bodoni Moda', serif;
      font-size: 2.7rem;
      line-height: 1.18;
      font-weight: 400;
      font-style: italic;
      letter-spacing: -0.01em;
    }

    .card-bottom {
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
    }

    .author-name {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 0.35rem;
    }

    .citation-type {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent-pink);
      margin-bottom: 0.25rem;
    }

    .citation-origin { font-size: 0.8rem; color: var(--text-muted); }

    /* Controlli */
    .controls {
      display: flex;
      gap: 0.8rem;
      margin-top: 1.5rem;
    }

    .btn {
      flex: 1;
      background: var(--text-main);
      color: #fff;
      border: 1px solid var(--text-main);
      padding: 0.95rem 1rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn:hover { background: var(--accent-pink); border-color: var(--accent-pink); }
    .btn.secondary { background: transparent; color: var(--text-main); }
    .btn.secondary:hover { background: var(--text-main); color: #fff; border-color: var(--text-main); }

    /* Azioni secondarie: discrete, sotto la card */
    .links {
      display: flex;
      justify-content: center;
      gap: 1.8rem;
      margin-top: 1.6rem;
    }

    .link-btn {
      background: none;
      border: none;
      border-bottom: 1px solid transparent;
      padding: 0.2rem 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .link-btn:hover { color: var(--text-main); border-bottom-color: var(--text-main); }
    .link-btn.hidden { display: none; }

    .toast {
      position: fixed;
      bottom: 2rem;
      background: var(--text-main);
      color: #fff;
      padding: 0.8rem 1.6rem;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    footer {
      font-size: 0.68rem;
      color: var(--text-muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 2rem;
    }

    @media (max-width: 600px) {
      .quote-card { padding: 1.5rem 1.3rem 1.7rem; min-height: 460px; }
      .quote-text { font-size: 2rem; }
    }
  </style>
</head>
<body>

  <div class="grain-overlay"></div>

  <header>
    <div class="brand-title">Stars Are Blind</div>
  </header>

  <main class="card-container">
    <div class="quote-card" id="quote-card">
      <div class="card-top">
        <span class="card-label" id="card-label">Quote del giorno</span>
        <span class="card-date" id="today-date"></span>
      </div>

      <div class="quote-wrap">
        <blockquote class="quote-text" id="quote-text"></blockquote>
      </div>

      <div class="card-bottom">
        <div class="author-name">Paris Hilton</div>
        <div class="citation-type" id="citation-type"></div>
        <div class="citation-origin" id="citation-origin"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="btn-share">Condividi</button>
      <button class="btn secondary" id="btn-capture">Salva card</button>
    </div>

    <div class="links">
      <button class="link-btn" id="btn-random">Un'altra quote</button>
      <button class="link-btn hidden" id="btn-daily">← Torna a oggi</button>
    </div>
  </main>

  <footer>Paris Hilton Archive — Editorial Edition</footer>

  <div class="toast" id="toast"></div>

  <script>
    // ------------------------------------------------------------------
    // DATABASE CITAZIONI
    // Per aggiungerne una basta copiare un blocco { ... }, e ricordarsi la virgola.
    // Le righe marcate "DA VERIFICARE" non sono confermate: controllale su fonti
    // primarie prima di pubblicare la pagina, oppure cancellale.
    // ------------------------------------------------------------------
    const quotesDatabase = [
      {
        quote: "That's hot.",
        type: "TV Show",
        source: "The Simple Life"
      },
      {
        quote: "Walmart... do they sell, like, wall stuff?",
        type: "TV Show",
        source: "The Simple Life (2003)"
      },
      { // DA VERIFICARE
        quote: "Always dress like you're going to see your worst enemy.",
        type: "Memoir",
        source: "Paris: The Memoir (2023)"
      },
      { // DA VERIFICARE
        quote: "Some girls are just born with glitter in their veins.",
        type: "Interview",
        source: "Late Show with David Letterman"
      },
      { // DA VERIFICARE
        quote: "Life is short. Live it like you're on vacation.",
        type: "Book",
        source: "Confessions of an Heiress (2004)"
      },
      { // DA VERIFICARE
        quote: "I'm not a dumb blonde. I'm just really good at pretending to be one.",
        type: "Documentary",
        source: "This Is Paris (2020)"
      },
      { // DA VERIFICARE
        quote: "The only rule is don't be boring and dress cute wherever you go.",
        type: "Interview",
        source: "Vogue Magazine (2007)"
      }
    ];

    // ------------------------------------------------------------------
    // UTILITÀ
    // ------------------------------------------------------------------
    const $ = (id) => document.getElementById(id);
    const today = new Date();

    $('today-date').textContent = today
      .toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
      .toUpperCase();

    function showToast(message) {
      const toast = $('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function getDailyIndex() {
      const startOfYear = new Date(today.getFullYear(), 0, 0);
      const dayOfYear = Math.floor((today - startOfYear) / 86400000);
      return dayOfYear % quotesDatabase.length;
    }

    const dailyIndex = getDailyIndex();
    let currentIndex = dailyIndex;

    function renderQuote(index) {
      const item = quotesDatabase[index];
      const card = $('quote-card');
      const isDaily = index === dailyIndex;

      card.style.opacity = '0';
      card.style.transform = 'translateY(8px)';

      setTimeout(() => {
        $('quote-text').textContent = `"${item.quote}"`;
        $('citation-type').textContent = item.type;
        $('citation-origin').textContent = item.source;
        $('card-label').textContent = isDaily ? 'Quote del giorno' : "Dall'archivio";
        $('btn-daily').classList.toggle('hidden', isDaily);
        card.style.opacity = '1';
        card.style.transform = 'translateY(0)';
      }, 200);
    }

    // ------------------------------------------------------------------
    // PULSANTI
    // ------------------------------------------------------------------
    $('btn-daily').addEventListener('click', () => {
      currentIndex = dailyIndex;
      renderQuote(currentIndex);
    });

    $('btn-random').addEventListener('click', () => {
      if (quotesDatabase.length < 2) return;
      let newIndex;
      do {
        newIndex = Math.floor(Math.random() * quotesDatabase.length);
      } while (newIndex === currentIndex);
      currentIndex = newIndex;
      renderQuote(currentIndex);
    });

    // Condividi: copia negli appunti (con fallback per contesti non sicuri)
    $('btn-share').addEventListener('click', async () => {
      const item = quotesDatabase[currentIndex];
      const text = `"${item.quote}" — Paris Hilton (${item.source})`;
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      showToast('Copiato negli appunti');
    });

    // Salva card come PNG (include etichetta e data, pronta per le stories)
    $('btn-capture').addEventListener('click', () => {
      if (typeof html2canvas === 'undefined') {
        showToast('html2canvas non caricato, riprova');
        return;
      }
      html2canvas($('quote-card'), {
        backgroundColor: '#ffffff',
        scale: 2,
        useCORS: true
      }).then((canvas) => {
        const link = document.createElement('a');
        link.download = 'stars-are-blind-paris-hilton.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(() => showToast('Errore nel salvataggio'));
    });

    // Prima citazione: sempre quella del giorno
    renderQuote(currentIndex);
  </script>
</body>
</html>
